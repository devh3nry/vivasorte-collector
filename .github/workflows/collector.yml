name: Viva Sorte Collector
on:
  workflow_dispatch:
    inputs:
      cycles:
        description: Number of one-minute cycles
        required: false
        default: '290'
  schedule:
    - cron: '17 */4 * * *'
concurrency:
  group: vivasorte-collector
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      INGEST_SECRET: ${{ secrets.VIVASORTE_INGEST_SECRET }}
      CYCLES: ${{ inputs.cycles || '290' }}
    steps:
      - name: Refresh all competitions every minute
        shell: bash
        run: |
          set -uo pipefail
          ids='168 166 437 309 326 818 432 1047 300 563 763 310 462 732 172 657 776 649 493 14 318 1580 8 1496 714 7 958'
          for ((cycle=1; cycle<=CYCLES; cycle++)); do
            started=$(date +%s)
            for id in $ids; do
              if ! curl --fail --silent --show-error --max-time 20 \
                -H 'accept: application/json, text/plain, */*' \
                -H 'origin: https://vivasorte.bet.br' \
                -H 'referer: https://vivasorte.bet.br/' \
                -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36' \
                "https://v-sportsbookapi.vivasorte.bet.br/api/matches/matchesbycompetition?competitionId=$id" > /tmp/upstream.json; then
                echo "Viva Sorte upstream failed for competition $id; retrying next cycle" >&2
                continue
              fi
              if ! jq -c --argjson id "$id" '{competitions: [{competitionId: $id, payload: .}]}' /tmp/upstream.json > /tmp/payload.json; then
                echo "Invalid Viva Sorte JSON for competition $id; retrying next cycle" >&2
                continue
              fi
              delivered=false
              for attempt in 1 2 3; do
                if curl --fail --silent --show-error --max-time 30 \
                  -X POST 'https://oddsnamao.com/api/vivasorte-ingest' \
                  -H 'content-type: application/json' \
                  -H "x-scraper-secret: $INGEST_SECRET" \
                  --data-binary @/tmp/payload.json > /dev/null; then
                  delivered=true
                  break
                fi
                sleep $((attempt * 2))
              done
              if [[ "$delivered" != true ]]; then
                echo "Ingest failed for competition $id after 3 attempts; retrying next cycle" >&2
              fi
            done
            elapsed=$(($(date +%s) - started))
            wait=$((60 - elapsed))
            if ((cycle < CYCLES && wait > 0)); then sleep "$wait"; fi
          done
